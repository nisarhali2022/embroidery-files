<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Embroidery File Exchange</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='15' fill='none' stroke='%232f4bd8' stroke-width='3'/%3E%3Cpath d='M8 17h18' stroke='%23c2410c' stroke-width='3' stroke-dasharray='3 3'/%3E%3Cpath d='M17 8v18' stroke='%232f4bd8' stroke-width='3' stroke-dasharray='3 3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1c2340; --muted:#5d6482; --line:#dfe2ec;
  --accent:#2f4bd8; --accent-ink:#ffffff; --accent-soft:#e6eafc;
  --thread:#c2410c; --thread-soft:#fdeee5; --overlay:rgba(20,24,45,.45);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12152a; --surface:#1b1f38; --ink:#e7e9f5; --muted:#a2a8c6; --line:#2e3355;
  --accent:#7d93ff; --accent-ink:#0f1330; --accent-soft:#262d58;
  --thread:#fb8a4c; --thread-soft:#3a2418; --overlay:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.login{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:22px}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--thread);border:1px solid var(--line);padding:6px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.login-card .err{color:var(--thread);font-size:13px;margin:0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-size:19px}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.role-pill{font-family:var(--f-mono);font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel-head h2{font-size:19px}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.readonly-note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 12px}
.table-box{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg);font-weight:600}
tr:last-child td{border-bottom:0}
td.sn,th.sn{width:64px;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
td.date{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
td.act,th.act{width:140px;text-align:right}
td.del,th.del{width:80px;text-align:right}
.fname{display:flex;align-items:center;gap:10px;word-break:break-all}
.ext{font-family:var(--f-mono);font-size:10.5px;font-weight:500;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);flex:none}
.ext.emb{background:var(--thread-soft);color:var(--thread)}
tr.new td{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.dash{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px}

.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:22px;display:grid;gap:16px;border:1px solid var(--line)}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:19px}
.x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px 16px;text-align:center;display:grid;gap:8px;justify-items:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:15px}
.drop span{color:var(--muted);font-size:13px}
.types{font-size:12px;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}
.queue{display:grid;gap:6px;max-height:180px;overflow:auto}
.queue div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;background:var(--bg);padding:8px 10px;border-radius:8px;word-break:break-all}
.queue em{font-style:normal;color:var(--muted);flex:none}
.queue .bad em{color:var(--thread)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){tr.new td{animation:none}.drop{transition:none}}
@media (max-width:520px){.panel{padding:14px}.login-card{padding:22px}}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M8 17h18" stroke="var(--thread)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M17 8v18" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/></svg>
      <h1>Embroidery File Exchange</h1>
    </div>
    <p>Sign in to share images and embroidery files.</p>
    <div class="field"><label for="user">Username</label><input id="user" autocomplete="username" autocapitalize="none" placeholder="admin or embroider"></div>
    <div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password"></div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
  </form>
</section>

<!-- APP -->
<div class="wrap" id="appView" hidden>
  <header class="topbar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M8 17h18" stroke="var(--thread)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M17 8v18" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/></svg>
      <h1>Embroidery File Exchange</h1>
    </div>
    <div class="who">Signed in as <span class="role-pill" id="whoName"></span>
      <button class="btn ghost small" id="logout" type="button">Sign out</button></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="images">Images <span class="count" id="c-images">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="embroidery">Embroidery Files <span class="count" id="c-embroidery">0</span></button>
  </div>

  <section class="panel" role="tabpanel">
    <div class="panel-head">
      <div><h2 id="panelTitle">Images</h2><p id="panelSub"></p></div>
      <div id="panelAction"></div>
    </div>
    <div class="table-box">
      <table>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<!-- UPLOAD POP-UP -->
<div class="overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle">Upload images</h2><button class="x" id="closeModal" aria-label="Close" type="button">×</button></div>
    <div class="drop" id="drop">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <strong>Drag and drop files here</strong>
      <span>or <button class="linkbtn" id="browse" type="button">choose files</button> from your computer</span>
      <input type="file" id="fileInput" multiple hidden>
    </div>
    <p class="types" id="typesNote"></p>
    <div class="queue" id="queue"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="cancel" type="button">Cancel</button>
      <button class="btn" id="doUpload" type="button" disabled>Upload</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
